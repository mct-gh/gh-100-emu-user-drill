name: Step 3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'records/pat-sso.md'

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: "3-step"
  cancel-in-progress: true

env:
  STEP_4_FILE: ".github/steps/4-step.md"
jobs:
  find_exercise:
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    needs: [find_exercise]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get response templates
        uses: actions/checkout@v7
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: github-actions[bot]
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: "Check file exists - pat-sso.md"
        id: check-file
        continue-on-error: true
        uses: skills/exercise-toolkit/actions/file-exists@v0.9.3
        with:
          file: 'records/pat-sso.md'

      - name: "Check keyphrase - fine-grained 토큰 결과"
        id: check-saml
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: records/pat-sso.md
          keyphrase: "fine-grained"
          case-sensitive: false

      - name: "Check keyphrase - 인가 설명"
        id: check-authz
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: records/pat-sso.md
          keyphrase: "인가"
          case-sensitive: false

      - name: "Check no token value - 토큰 값을 붙여 넣지 않았다"
        id: check-no-token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -qE '(gh[pousr]_|github_pat_)[A-Za-z0-9_]{10,}' records/pat-sso.md; then
            echo "::error::기록 파일에 토큰 값이 들어 있습니다. 지우고 다시 push 하세요. 그리고 그 토큰은 폐기하세요."
            exit 1
          fi
          echo "토큰 값 없음. 좋습니다."

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 3
            results_table:
              - description: "pat-sso.md 를 만들었다"
                passed: ${{ steps.check-file.outcome == 'success' }}
              - description: "fine-grained 토큰으로 부른 결과를 적었다"
                passed: ${{ steps.check-saml.outcome == 'success' }}
              - description: "인증과 인가의 차이를 적었다"
                passed: ${{ steps.check-authz.outcome == 'success' }}
              - description: "토큰 값을 붙여 넣지 않았다"
                passed: ${{ steps.check-no-token.outcome == 'success' }}

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get response templates
        uses: actions/checkout@v7
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 4

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_4_FILE }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Step 4"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
