name: Step 4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'records/audit-trail.md'

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: "4-step"
  cancel-in-progress: true

env:
  REVIEW_FILE: ".github/steps/x-review.md"
jobs:
  find_exercise:
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    needs: [find_exercise]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get response templates
        uses: actions/checkout@v7
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: github-actions[bot]
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: "Check file exists - audit-trail.md"
        id: check-file
        continue-on-error: true
        uses: skills/exercise-toolkit/actions/file-exists@v0.9.3
        with:
          file: 'records/audit-trail.md'

      - name: "Check keyphrase - 로그인 이벤트"
        id: check-login-event
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: records/audit-trail.md
          keyphrase: "login"
          case-sensitive: false

      - name: "Check keyphrase - 리포 이벤트"
        id: check-repo-event
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: records/audit-trail.md
          keyphrase: "repo"
          case-sensitive: false

      - name: "Check keyphrase - 조직과 엔터프라이즈 차이"
        id: check-enterprise
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: records/audit-trail.md
          keyphrase: "엔터프라이즈"
          case-sensitive: false

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 4
            results_table:
              - description: "audit-trail.md 를 만들었다"
                passed: ${{ steps.check-file.outcome == 'success' }}
              - description: "로그인 이벤트 이름을 적었다"
                passed: ${{ steps.check-login-event.outcome == 'success' }}
              - description: "리포 관련 이벤트 이름을 적었다"
                passed: ${{ steps.check-repo-event.outcome == 'success' }}
              - description: "조직 감사 로그와 엔터프라이즈 감사 로그의 차이를 적었다"
                passed: ${{ steps.check-enterprise.outcome == 'success' }}

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_review_content:
    name: Post review content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get response templates
        uses: actions/checkout@v7
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished - final review next
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md

      - name: Create comment - add review content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}

      - name: Disable current workflow
        run: gh workflow disable "${{ github.workflow }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, post_review_content]
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.3
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "EMU 사용자로 살아 보기"
